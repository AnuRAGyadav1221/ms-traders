<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
		th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="UTF-8">
	<title>Product Page</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<section>
		<div class="container-fluid bg-primary p-5">
			<div class="row justify-content-center">
				<div class="col-md-8 offset-md-2">
					<form action="/products" method="get">
						<div class="input-group">
							<input type="text" class="form-control" name="ch" placeholder="Search products...">
							<button class="btn btn-light text-dark ms-3 col-md-2"> 
								<i class="fa-solid fa-magnifying-glass"></i> 
								Search
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		
		<div class="container-fluid mt-4">
			<div class="row">
				<div class="col-md-2">
					<div class="list-group">
						<p class="fs-5 category-title">Categories</p>
  						<a href="/products" 
							th:classappend="${param.category == null or not param.containsKey('category')} ? 'active' : ''"
							class="list-group-item list-group-item-action active" aria-current="true">
							All
						</a>
						<a th:each="c : ${categories}" th:href="@{'/products?category=' + ${c.name}}"
							th:classappend="${paramValue == c.name} ? 'active' : ''"
							class="list-group-item list-group-item-action">
							[[${c.name}]]
						</a>			
					</div>
				</div>
				
				<div class="col-md-10">
					<div class="card shadow-lg p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body">
							<p class="fs-3 text-center mb-4 product-title">Products</p><hr>
							<div class="row">
								<th:block th:if="${productsSize > 0}">

								<div class="col-md-3 mb-4" th:each="p:${products}">
									<div class="card h-100">
										<div class="card-body text-center">
											<img alt="" th:src="${p.image}" width="100%" height="150px">
											<p class="fs-5">[[${p.title}]]</p>
											<div class="row text-center">
												<p class="fs-6 fw-bold">
													<span>&#8377; [[${p.discountPrice}]]</span></br>
													<span class="text-decoration-line-through text-secondary">&#8377; [[${p.price}]]</span>
													<span class="fs-6 text-success">[[${p.discount}]] off</span>
												</p>
												<a th:href="@{'/product_view/' + ${p.id}} "
													class="btn btn-primary col-md-6 offset-md-3">View Details</a>
											</div>
										</div>
									</div>
								</div>
								
								</th:block>
								
								<th:block th:unless="${productsSize > 0}">
									<p class="fs-4 text-center mt-4 text-danger">Products not Available</p>
								</th:block>
								<!-- END -->
							</div>
						</div>
					</div>
				</div>

				<!-- Start Pagination -->
				<div class="container text-center mt-3">
					<div class="row justify-content-center">
						<div class="col-12">
							<p>Total Products: [[${totalElements}]]</p>
						</div>
						
						<div class="col-12 d-flex justify-content-center">
							<th:block th:if="${productsSize > 0}">

							
							<nav aria-label="Page navigation">
								<ul class="pagination">
								  <li class="page-item" th:classappend="${isFirst} ? 'disabled':'' ">
									<a class="page-link" th:href="@{'/products?pageNo='+${pageNo-1}}" aria-label="Previous">
									  	<span aria-hidden="true">&laquo;</span>
									</a>
								  </li>
								  <li th:each="i:${#numbers.sequence(1,totalPages)}" class="page-item" th:classappend="${pageNo+1 == i}?'active':''">
									<a class="page-link" th:href="@{'/products?pageNo='+${i-1}}">[[${i}]]</a></li>
								 
								  <li class="page-item" th:classappend="${isLast} ? 'disabled':'' ">
									<a class="page-link" th:href="@{'/products?pageNo='+${pageNo+1}}" aria-label="Next">
									  <span aria-hidden="true">&raquo;</span>
									</a>
								  </li>
								</ul>
							</nav>
							</th:block>
						</div>
					</div>
				</div>				
				
			</div>
		</div>
	
	</section>
</body>
</html>
