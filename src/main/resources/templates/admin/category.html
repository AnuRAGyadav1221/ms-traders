<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
		th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Category Page</title>
	<link rel="stylesheet" href="/css/style.css">
</head>

<body>

	<section>
	
		<!-- Start Category Mode -->
		<div class="container-fluid p-5 mt-4">
			<hr>
			<div class="mb-3 text-start">
				<a href="/admin/" class="btn btn-outline-dark btn-sm rounded-3 align-items-center gap-1">
					<i class="fa-solid fa-arrow-left"></i>
					Back to Admin
				</a>
			</div>
			<div class="row p-5">
			
				<div class="col-md-4">
					
					<div class="card card-sh">

						<div class="card-header text-center">
							<p class="fs-4">Add Category</p>
							<th:block th:if="${session.sucMsg}">
								<p class="text-success fw-bold" th:text="${session.sucMsg}"></p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold" th:text="${session.errorMsg}"></p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

						</div>
						
							<div class="card-body">
								<form action="/admin/saveCategory" method="post" 
								enctype="multipart/form-data">
									<div class="mb-3">
										<label>Enter Category</label>
										<input type="text" class="form-control" name="name">
									</div>

									<div class="mb-3">
										<label>Status</label>
										<div class="form-check">
											<input class="form-check-input" type="radio" name="isActive" 
											id="flexRadioDefault1" checked value="true">
											<label class="form-check-label" for="flexRadioDefault1">
											  Active
											</label>
										</div>
										<div class="form-check">
											<input class="form-check-input" type="radio" name="isActive" 
											id="flexRadioDefault2" value="false">
											<label class="form-check-label" for="flexRadioDefault2">
											  Inactive
											</label>
										</div>
									</div>
									
									<div class="mb-3">
										<label>Upload Image</label>
										<input type="file" class="form-control" name="file">
									</div>	
									<button class="btn btn-primary col-md-12 mt-2">Save</button>
								</form>
							</div>
					</div>
					
				</div>
				
				<div class="col-md-8 mb-4">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">Category Details</div>
							<div class="card-body">
								<table class="table">
								  <thead class="table-dark">
								    <tr>
								      <th scope="col">S.No.</th>
								      <th scope="col">Category</th>
									  <th scope="col">Status</th>
								      <th scope="col">Image</th>
								      <th scope="col">Action</th>
								    </tr>
								  </thead>
								  <tbody>
								    <tr th:each="cat, c: ${categories}">
										<th scope="row">[[${c.count}]]</th> 
										<td>[[${cat.name}]]</td>
										<td>[[${cat.isActive}]]</td>
										<td><img th:src="${cat.imageName}" width="50px" height="50px"></td>
										<td>
											<a th:href="@{'/admin/loadEditCategory/' + ${cat.id}}" class="btn btn-primary btn-sm">
											<i class="fa-solid fa-pen-to-square fa-1x"></i>Edit</a>
											<a th:href="@{'/admin/deleteCategory/' + ${cat.id}}" class="btn btn-danger btn-sm"><i class="fa-solid fa-trash fa-1x"></i>Delete</a>
										</td>
									</tr>									
								  </tbody>
								</table>

								<!-- Start Pagination -->
								<div class="container text-center mt-3">
									<div class="row justify-content-center">
										<div class="col-12">
											<p>Total Categories : [[${totalElements}]]</p>
										</div>
										
										<div class="col-12 d-flex justify-content-center">
											<th:block th:if="${categoriesSize > 0}">

											
											<nav aria-label="Page navigation">
												<ul class="pagination">
													<li class="page-item" th:classappend="${isFirst} ? 'disabled':'' ">
														<a class="page-link" th:href="@{'/admin/category?pageNo='+${pageNo-1}}" aria-label="Previous">
															<span aria-hidden="true">&laquo;</span>
														</a>
													</li>
													<li th:each="i:${#numbers.sequence(1,totalPages)}" class="page-item" th:classappend="${pageNo+1 == i}?'active':''">
														<a class="page-link" th:href="@{'/admin/category?pageNo='+${i-1}}">[[${i}]]</a></li>
													
													<li class="page-item" th:classappend="${isLast} ? 'disabled':'' ">
														<a class="page-link" th:href="@{'/admin/category?pageNo='+${pageNo+1}}" aria-label="Next">
														<span aria-hidden="true">&raquo;</span>
														</a>
													</li>
												</ul>
											</nav>
											</th:block>
										</div>
									</div>
								</div>

							</div>
						</div>
				</div>
				
				
				
			</div>
		</div>
		<!-- End Category Mode -->
		
	</section>  
</body>
</html>
