<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
		th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
	<link rel="stylesheet" href="/css/style.css">
</head>

<body>

	<section>
	
		<!-- Start Category Mode -->
		<div class="container">
			<p class="text-center fs-3 category-title mt-4">ADMIN DASHBOARD</p>
			<div class="row p-5">
				
				<div class="col-md-4 mb-4">
					<a href="/admin/loadAddProduct" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center text-primary">
								<i class="fa-solid fa-square-plus fa-2x text-secondary"></i>
								<h4>Add Product</h4>
							</div>
						</div>
					</a>
				</div>
				
				<div class="col-md-4 mb-4">
					<a href="/admin/category" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center text-primary">
								<i class="fa-solid fa-list-ul fa-2x text-warning"></i>
								<h4>Category</h4>
							</div>
						</div>
					</a>
				</div>
				
				<div class="col-md-4 mb-4">
					<a href="/admin/view_products" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center text-primary">
								<i class="fa-solid fa-table-list fa-2x text-success"></i>
								<h4>View Product</h4>
							</div>
						</div>
					</a>
				</div>
				
				<div class="col-md-4 mb-4">
					<a href="/admin/orders" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center text-primary">
								<i class="fa-solid fa-box-open fa-2x text-warning"></i>
								<h4>Orders</h4>
							</div>
						</div>
					</a>
				</div>
				
				<div class="col-md-4 mb-4">
					<a href="/admin/users?type=1" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center text-primary">
								<i class="fa-duotone fa-solid fa-user fa-2x text-secondary"></i>
								<h4>User</h4>
							</div>
						</div>
					</a>
				</div>
				
				<div class="col-md-4 mb-4">
					<a href="/admin/add_admin" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center text-primary">
								<i class="fa-duotone fa-solid fa-user-plus fa-2x text-secondary"></i>
								<h4>Add Admin</h4>
							</div>
						</div>
					</a>
				</div>

				<div class="col-md-4 mb-4">
					<a href="/admin/users?type=2" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center text-primary">
								<i class="fa-duotone fa-solid fa-user fa-2x text-secondary"></i>
								<h4>Admin</h4>
							</div>
						</div>
					</a>
				</div>
				
				
			</div>
		</div>
		<!-- End Category Mode -->
		
	</section>  
</body>
</html>
